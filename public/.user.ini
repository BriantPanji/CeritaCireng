; PHP Configuration for Windows development environment
; This file configures PHP settings for the application

; Set the upload temp directory to Laravel's storage directory
; This fixes the "unable to create a temporary file" error on Windows
upload_tmp_dir = "../storage/app/private/tmp"

; Ensure file uploads are enabled
file_uploads = On

; Set reasonable upload limits
upload_max_filesize = 12M
post_max_size = 12M
max_file_uploads = 20
